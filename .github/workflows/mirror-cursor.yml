name: Mirror Cursor Server Release

on:
  workflow_dispatch:  # 手动触发

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download cursor-server tarball
        run: |
          curl -L -o vscode-reh-linux-x64.tar.gz "https://cursor.blob.core.windows.net/remote-releases/96e5b01ca25f8fbd4c4c10bc69b15f6228c80770/vscode-reh-linux-x64.tar.gz"

      - name: Create Release and upload asset
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: reh-linux-x64
          name: reh-linux-x64
          body: Mirror of cursor-server vscode reh linux x64 tarball

      - name: Upload release asset
        uses: softprops/action-gh-release-upload@v1
        with:
          tag_name: reh-linux-x64
          asset_path: vscode-reh-linux-x64.tar.gz
          asset_name: vscode-reh-linux-x64.tar.gz
